[project]
name = "ja-postgres-mcp-client-backend"
version = "0.1.0"
description = "FastAPI + agent backend for ja-postgres-mcp-client."
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "mcp>=2,<3",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (real MCP server, Ollama or external API)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
