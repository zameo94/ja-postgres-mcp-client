# Development stack: client backend + frontend.
#
#   docker compose up --build
#
# The MCP server is a SEPARATE project and runs on the host (its own Compose or
# process). The backend container reaches it via host.docker.internal, so the MCP
# server's JA_POSTGRES_ALLOWED_HOSTS must include host.docker.internal:8000
# (the server validates the Host header). Verified against the sibling project.
#
# LLM: by default the backend expects a native Ollama on the host
# (host.docker.internal:11434). To run Ollama in a container instead, add the
# overlay (see docker-compose.ollama.yaml):
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml up --build
#
# Copy .env.example to .env first (the backend reads .env). Settings like
# JA_CLIENT_SYSTEM_PROMPT, JA_CLIENT_SCHEMA or JA_CLIENT_LOG_LEVEL can be tuned
# without rebuilding; the container network URLs below override native values.
#
# All published ports are bound to 127.0.0.1 only.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      JA_CLIENT_ENVIRONMENT: development
      JA_CLIENT_HOST: 0.0.0.0
      JA_CLIENT_PORT: "8100"
      JA_CLIENT_RELOAD: "false"
      JA_CLIENT_MCP_SERVER_URL: http://host.docker.internal:8000/mcp
      JA_CLIENT_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8100"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_BASE_URL: http://backend:8100
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
